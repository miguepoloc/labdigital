# LabDigital GIDEAM — producción (ver deploy/README.md). Variables en ~/labdigital-deploy/.env (fuera de git).
name: labdigital

x-backend-env: &backend-env
  APP_ENV: prod
  # Solo el gateway de la red labdigital (nginx del host llega por ahí) puede fijar X-Forwarded-For
  FORWARDED_ALLOW_IPS: 172.31.88.1
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
  JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
  JWT_KID: ${JWT_KID}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  MAIL_FROM: ${MAIL_FROM:-LabDigital GIDEAM <no-responder@mcda.tools>}
  PUBLIC_BASE_URL: https://gideam.unimagdalena.edu.co/labdigital
  ADMIN_EMAILS: ${ADMIN_EMAILS}
  COOKIE_SECURE: "true"
  BLOB_DIR: /data/blobs

services:
  db:
    networks: [labdigital]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g

  api:
    networks: [labdigital]
    build: ../backend
    image: labdigital-api:latest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: *backend-env
    volumes:
      - blobs:/data/blobs
    ports:
      - "127.0.0.1:8088:8000"
    mem_limit: 1g

  worker:
    networks: [labdigital]
    image: labdigital-api:latest           # misma imagen; otro comando (outbox -> correo)
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy }, api: { condition: service_started } }
    environment: *backend-env
    command: ${WORKER_COMMAND:-python -m backend.entrypoints.worker.main}
    # El HEALTHCHECK de la imagen consulta la API HTTP; el worker no la sirve. Vivo = el proceso del worker sigue corriendo.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'backend.entrypoints.worker' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m

  web:
    networks: [labdigital]
    build: ../frontend
    image: labdigital-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:80"
    mem_limit: 256m

  # Solo para pruebas: buzon que captura los correos (docker compose --profile mail-dev ...).
  # UI en http://127.0.0.1:8025 ; en el .env: SMTP_HOST=mailpit SMTP_PORT=1025 SMTP_STARTTLS=false
  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: ["mail-dev"]
    restart: unless-stopped
    networks: [labdigital]
    ports:
      - "127.0.0.1:8025:8025"
    mem_limit: 128m

networks:
  labdigital:
    ipam:
      config:
        - subnet: 172.31.88.0/24
          gateway: 172.31.88.1

volumes:
  db_data:
  blobs:
