# LabDigital GIDEAM — producción (ver deploy/README.md). Variables en ~/labdigital-deploy/.env (fuera de git).
name: labdigital

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
  JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
  JWT_KID: ${JWT_KID}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_STARTTLS: "true"
  MAIL_FROM: ${MAIL_FROM:-LabDigital GIDEAM <no-responder@mcda.tools>}
  PUBLIC_BASE_URL: https://gideam.unimagdalena.edu.co/labdigital
  ADMIN_EMAILS: ${ADMIN_EMAILS}
  COOKIE_SECURE: "true"
  BLOB_DIR: /data/blobs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g

  api:
    build: ../backend
    image: labdigital-api:latest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: *backend-env
    volumes:
      - blobs:/data/blobs
    ports:
      - "127.0.0.1:8088:8000"
    mem_limit: 1g

  worker:
    image: labdigital-api:latest           # misma imagen; otro comando (outbox -> correo)
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy }, api: { condition: service_started } }
    environment: *backend-env
    command: ${WORKER_COMMAND:-python -m backend.entrypoints.worker}
    mem_limit: 512m

  web:
    build: ../frontend
    image: labdigital-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:80"
    mem_limit: 256m

volumes:
  db_data:
  blobs:
