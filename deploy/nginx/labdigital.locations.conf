# LabDigital GIDEAM — bloques para el server 443 de gideam.unimagdalena.edu.co
# (se incluyen en /etc/nginx/sites-available/gideam con: include /etc/nginx/snippets/labdigital.conf;)
# Requiere en http{} el map de conf.d/jgfpga-map.conf ($jgfpga_connection_upgrade).
#
#   /labdigital/            -> labdigital-web  127.0.0.1:8089 (landing prerender + SPA)
#   /labdigital/api/        -> labdigital-api  127.0.0.1:8088 (FastAPI, root_path=/labdigital/api)
#   /labdigital/fpga/       -> jgfpga          127.0.0.1:8087 (solo con sesion: auth_request)
#   /fpga/...               -> 301 /labdigital/fpga/...

# ── Verificacion de sesion para los modulos (subpeticion interna) ─────────────
location = /labdigital/_auth {
    internal;
    proxy_pass              http://127.0.0.1:8088/v1/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        Host   $host;
    proxy_set_header        X-Original-URI $request_uri;
}

# Sin sesion valida: /sesion intenta renovar con el refresh y vuelve; si no, al login
location @labdigital_login {
    return 302 /labdigital/sesion?next=$request_uri;
}

# ── API ──────────────────────────────────────────────────────────────────────
location /labdigital/api/ {
    proxy_pass         http://127.0.0.1:8088/;          # quita /labdigital/api
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # SUSTITUYE (no añade): lo que mande el cliente en X-Forwarded-For se descarta, así no puede falsear su IP
    # para saltarse los límites de intentos (revisión de seguridad, hallazgo 1)
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    client_max_body_size 110m;                          # 100 MB por entrega + margen
    proxy_read_timeout 120s;
}

# ── Modulo FPGA (JG FPGA), protegido ────────────────────────────────────────
location = /labdigital/fpga { return 301 /labdigital/fpga/; }
location /labdigital/fpga/ {
    auth_request     /labdigital/_auth;
    auth_request_set $ld_user  $upstream_http_x_labdigital_user;
    auth_request_set $ld_email $upstream_http_x_labdigital_email;
    auth_request_set $ld_name  $upstream_http_x_labdigital_name;
    auth_request_set $ld_role  $upstream_http_x_labdigital_role;
    error_page 401 = @labdigital_login;

    proxy_pass         http://127.0.0.1:8087/;          # quita /labdigital/fpga
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # JG FPGA no usa cookies: no recibe ld_access/ld_refresh/ld_session (un fallo en el módulo no expone el JWT).
    # La subpetición /labdigital/_auth sigue leyendo la cookie original ($http_cookie).
    proxy_set_header   Cookie            "";
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $jgfpga_connection_upgrade;
    # Identidad verificada por nginx; lo que mande el cliente se pisa
    proxy_set_header   X-LabDigital-User  $ld_user;
    proxy_set_header   X-LabDigital-Email $ld_email;
    proxy_set_header   X-LabDigital-Name  $ld_name;
    proxy_set_header   X-LabDigital-Role  $ld_role;
    proxy_read_timeout 3600s;
    client_max_body_size 50m;
}

# Enlaces viejos de JG FPGA
location = /fpga  { return 301 /labdigital/fpga/; }
location ^~ /fpga/ { rewrite ^/fpga/(.*)$ /labdigital/fpga/$1 permanent; }

# ── Web (landing + SPA) ─────────────────────────────────────────────────────
location = /labdigital { return 301 /labdigital/; }
location /labdigital/ {
    proxy_pass         http://127.0.0.1:8089;           # el contenedor sirve bajo /labdigital/
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
}
