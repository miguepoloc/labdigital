target-version = "py313"
line-length = 100
src = ["src", "tests"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID252"]
ignore = ["E501"]  # ruff format owns line length; see ARCHITECTURE.md §17.3

[lint.isort]
known-first-party = ["backend"]
force-sort-within-sections = true

[format]
quote-style = "double"
