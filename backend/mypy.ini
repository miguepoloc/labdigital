[mypy]
python_version = 3.13
mypy_path = src
namespace_packages = True
explicit_package_bases = True
plugins = pydantic.mypy
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

; uuid_extensions ships no stubs/py.typed marker — too small a package to be worth vendoring
; stubs for. boto3 typing is handled by the boto3-stubs dev dependency instead of an
; ignore here (see pyproject.toml's [dev] extra).
[mypy-uuid_extensions]
ignore_missing_imports = True
