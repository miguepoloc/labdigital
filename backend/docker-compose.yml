services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=backend
      - POSTGRES_PASSWORD=backend
      - POSTGRES_DB=backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
