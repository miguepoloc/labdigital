# nginx del contenedor labdigital-web: sirve el build estático bajo /labdigital/.
# El nginx del host (TLS, /labdigital/api, auth_request de módulos) hace de proxy hacia aquí.

# Caché: assets con hash ⇒ inmutables; HTML ⇒ siempre revalidar.
map $uri $ld_cache_control {
    ~^/labdigital/assets/   "public, max-age=31536000, immutable";
    default                 "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Cache-Control $ld_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Sin scripts en línea (el tema se aplica con /labdigital/theme-init.js). Estilos en línea: atributos :style de Vue.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.unimagdalena.edu.co; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /labdigital {
        return 301 /labdigital/;
    }

    # Assets con hash.
    location /labdigital/assets/ {
        try_files $uri =404;
    }

    # Área privada: siempre el cascarón de la SPA (el router decide; la guardia pide /me).
    location /labdigital/app {
        try_files /labdigital/_shell.html =404;
    }

    # Landing (index.html) y páginas de cuenta prerenderizadas (entrar.html, registro.html…);
    # cualquier otra ruta cae en el cascarón y la SPA muestra "Página no encontrada".
    location /labdigital/ {
        try_files $uri $uri.html $uri/ /labdigital/_shell.html;
    }

    location / {
        return 404;
    }
}
